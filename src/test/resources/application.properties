spring.datasource.url=jdbc:postgresql://localhost:5432/ohara_test
spring.datasource.username=ohara
spring.datasource.password=ohara
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.threads.virtual.enabled=true
spring.main.banner-mode=off

jwt.secret=ohara-test-jwt-secret-key-should-be-at-least-32-chars
jwt.access-token-validity-ms=3600000
jwt.refresh-token-validity-ms=604800000
