spring:
  application:
    name: Ohara
  datasource:
    url: jdbc:postgresql://postgres:5432/ohara
    username: ohara
    password: ohara
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: redis
      port: 6379
  threads:
    virtual:
      enabled: true

server:
  port: 8080

jwt:
  secret: ohara-docker-jwt-secret-key-should-be-at-least-32-chars
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 604800000

auth:
  refresh-cookie:
    secure: false  # plain HTTP in compose; set true behind TLS

management:
  endpoints:
    web:
      exposure:
        include: health,info
