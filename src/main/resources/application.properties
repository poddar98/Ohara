spring.application.name=Ohara
info.app.version=0.0.1-SNAPSHOT

management.endpoints.web.exposure.include=health,info,prometheus
# Metrics are served only on the internal management port (management.server.port, set per environment; see
# SecurityConfig). Without one, /actuator/prometheus is refused.
# Latency percentiles for SLOs (docs 12 R6: API p95 < 300 ms, playback session p95 < 200 ms).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# CSV imports are limited to 1 MB in the service; leave headroom for the multipart envelope.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# Batch inserts (bulk import rows).
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
